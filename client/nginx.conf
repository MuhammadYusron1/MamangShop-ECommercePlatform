# ============================================================
#  client/nginx.conf — serves the React build + proxies /api
#  ============================================================
#  LEARNING NOTE — why nginx in the client container?
#  The React Vite build outputs static files (HTML, JS, CSS).
#  nginx is a lightweight, fast web server that serves these
#  files. Crucially, it also PROXIES /api requests to the backend
#  container, so the browser talks to one origin (localhost:3000)
#  and doesn't face CORS issues in production.
#
#  Route logic:
#    /api/*  → proxy_pass to http://server:5000 (the Express API)
#    /*      → serve the static React build files
#  For React Router (client-side routes) to work, any URL that
#  isn't a static file must fallback to index.html, which is why
#  the `try_files` directive falls back to /index.html.
# ============================================================

server {
    listen 80; # nginx listens on port 80 inside the container
    server_name localhost;

    # ---------- Proxy API requests to the backend ----------
    location /api/ {
        # Proxy to the backend container's port 5000.
        # "server" is the SERVICE name in compose.yaml.
        proxy_pass http://server:5000/api/;

        # Standard proxy headers — let the backend see the real
        # client IP and that this was proxied.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- Serve the React static build ----------
    location / {
        # Serve files from the Vite build output.
        root /usr/share/nginx/html;   # nginx default static path
        index index.html;

        # fallback: if no static file matches, serve index.html so
        # React Router handles the URL client-side.
        try_files $uri $uri/ /index.html;
    }

    # ---------- Cache static assets aggressively ----------
    # Vite hashes file names (e.g. index-abc123.js). When the content
    # changes, the hash changes → new filename → browser re-fetches.
    # So we can safely cache old filenames very aggressively.
    location /assets/ {
        # IMPORTANT: the `/assets/` prefix match OVERRIDES `location /`,
        # so we MUST re-declare root + try_files here or nginx returns
        # 404 for every JS/CSS file (which caused a blank page!).
        root /usr/share/nginx/html;
        try_files $uri $uri/ =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Disable server-side directory listing (security).
    autoindex off;
}
